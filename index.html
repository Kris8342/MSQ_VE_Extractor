<!DOCTYPE html>
<html>
<head>
<title>MSQ → VE Table Extractor</title>
<style>
body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; margin: 40px; }
h1 { color: #ff6f00; }
#dropZone {
    border: 3px dashed #ff6f00; border-radius: 10px; padding: 60px;
    text-align: center; font-size: 22px; color: #999; margin: 30px 0;
    cursor: pointer; transition: all 0.3s;
}
#dropZone:hover, #dropZone.dragover { border-color: #ffab00; color: #ffab00; background: #2a2a1a; }
#status { font-size: 16px; margin: 10px 0; }
button { background: #ff6f00; color: white; border: none; padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 5px; margin: 5px; }
button:hover { background: #ff8f00; }
.btn-blue { background: #1976d2; }
.btn-blue:hover { background: #2196f3; }
.btn-green { background: #388e3c; }
.btn-green:hover { background: #4caf50; }
.btn-gray { background: #555; }
.btn-gray:hover { background: #777; }
#buttons { display: none; margin: 15px 0; }
#info { display: none; background: #111; padding: 15px; border-radius: 5px; margin: 15px 0; font-size: 13px; line-height: 1.6; white-space: pre; }
#tableDisplay { display: none; margin: 15px 0; }
table.ve { border-collapse: collapse; font-size: 12px; }
table.ve th { background: #333; color: #ff6f00; padding: 4px 8px; border: 1px solid #444; text-align: center; min-width: 40px; }
table.ve td { background: #222; padding: 4px 8px; border: 1px solid #333; text-align: center; }
table.ve td.header { background: #333; color: #ff6f00; font-weight: bold; }
#output { display: none; white-space: pre; background: #111; padding: 20px; border-radius: 5px; margin: 15px 0; font-size: 13px; line-height: 1.4; overflow-x: auto; max-height: 400px; overflow-y: auto; }
.label { color: #999; font-size: 12px; margin-bottom: 4px; }
select { background: #333; color: #e0e0e0; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
<h1>MSQ → VE Table Extractor</h1>
<p style="color:#999;">Drop your .msq file — extracts VE table, breakpoints, injector dead time, EGO settings, MAT correction, and full tune summary.</p>

<div id="dropZone" onclick="document.getElementById('fileInput').click()">
    Drop .msq file here
</div>
<input type="file" id="fileInput" accept=".msq" style="display:none">

<div id="status"></div>
<div id="info"></div>

<div id="buttons">
    <span class="label">VE Table: </span>
    <select id="tableSelect" onchange="displaySelected()"></select>
    <span style="margin-left: 20px;">
        <button onclick="copyVETable()">Copy VE Table</button>
        <button class="btn-blue" onclick="copyBreakpoints()">Copy Breakpoints</button>
        <button class="btn-green" onclick="copyAll()">Copy All (Table + Breakpoints)</button>
        <button class="btn-gray" onclick="downloadMSQInfo()">Download Summary</button>
    </span>
</div>

<div id="tableDisplay"></div>
<div id="output"></div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
let parsedData = null;
let selectedTable = 'veTable1';

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => { if (e.target.files.length) processFile(e.target.files[0]); });

function processFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
        try {
            parsedData = parseMSQ(e.target.result);
            displayResults();
            document.getElementById('status').textContent = '✓ MSQ parsed successfully';
            document.getElementById('status').style.color = '#4CAF50';
        } catch (err) {
            document.getElementById('status').textContent = '✗ Error: ' + err.message;
            document.getElementById('status').style.color = '#ff4444';
            console.error(err);
        }
    };
    reader.readAsText(file, 'iso-8859-1');
}

function parseMSQ(text) {
    const result = {
        meta: {},
        tables: {},
        breakpoints: {}
    };

    // Parse metadata
    const authorMatch = text.match(/author="([^"]+)"/);
    if (authorMatch) result.meta.author = authorMatch[1];

    const dateMatch = text.match(/writeDate="([^"]+)"/);
    if (dateMatch) result.meta.date = dateMatch[1];

    const firmwareMatch = text.match(/firmwareInfo="([^"]+)"/);
    if (firmwareMatch) result.meta.firmware = decodeURIComponent(firmwareMatch[1].replace(/\+/g, ' '));

    // Parse algorithm
    const algoMatch = text.match(/<constant name="algorithm">"([^"]+)"/);
    if (algoMatch) result.meta.algorithm = algoMatch[1];

    // Parse number of cylinders
    const cylMatch = text.match(/<constant name="nCylinders">"(\d+)"/);
    if (cylMatch) result.meta.cylinders = cylMatch[1];

    // Parse VE tables (1, 2, 3)
    for (let t = 1; t <= 3; t++) {
        const tableName = `veTable${t}`;
        const rpmName = `frpm_table${t}`;
        const mapName = `fmap_table${t}`;

        const tableRegex = new RegExp(`<constant[^>]*name="${tableName}"[^>]*rows="(\\d+)"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const tableMatch = text.match(tableRegex);
        if (tableMatch) {
            const rows = parseInt(tableMatch[1]);
            const values = tableMatch[2].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
            const cols = values.length / rows;
            const table = [];
            for (let r = 0; r < rows; r++) {
                table.push(values.slice(r * cols, (r + 1) * cols));
            }
            result.tables[tableName] = { data: table, rows: rows, cols: cols };
        }

        const rpmRegex = new RegExp(`<constant[^>]*name="${rpmName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const rpmMatch = text.match(rpmRegex);
        if (rpmMatch) {
            result.breakpoints[rpmName] = rpmMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        }

        const mapRegex = new RegExp(`<constant[^>]*name="${mapName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const mapMatch = text.match(mapRegex);
        if (mapMatch) {
            result.breakpoints[mapName] = mapMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        }
    }

    // 12x12 tables
    for (let t = 1; t <= 3; t++) {
        const tableName = `veTable${t}dozen`;
        const rpmName = `frpm_table${t}doz`;
        const mapName = `fmap_table${t}doz`;

        const tableRegex = new RegExp(`<constant[^>]*name="${tableName}"[^>]*rows="(\\d+)"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const tableMatch = text.match(tableRegex);
        if (tableMatch) {
            const rows = parseInt(tableMatch[1]);
            const values = tableMatch[2].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
            const cols = values.length / rows;
            const table = [];
            for (let r = 0; r < rows; r++) {
                table.push(values.slice(r * cols, (r + 1) * cols));
            }
            result.tables[tableName] = { data: table, rows: rows, cols: cols };
        }

        const rpmRegex = new RegExp(`<constant[^>]*name="${rpmName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const rpmMatch = text.match(rpmRegex);
        if (rpmMatch) {
            result.breakpoints[rpmName] = rpmMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        }

        const mapRegex = new RegExp(`<constant[^>]*name="${mapName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const mapMatch = text.match(mapRegex);
        if (mapMatch) {
            result.breakpoints[mapName] = mapMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        }
    }

    // EGO settings
    const egoMatch = text.match(/<constant[^>]*name="EgoOption"[^>]*>"([^"]+)"/);
    if (egoMatch) result.meta.egoOption = egoMatch[1];

    const egoAuthMatch = text.match(/<constant[^>]*name="egoLimit"[^>]*>([\d.]+)/);
    if (egoAuthMatch) result.meta.egoAuthority = egoAuthMatch[1] + '%';

    const egoCountMatch = text.match(/<constant[^>]*name="egoCount"[^>]*>([\d.]+)/);
    if (egoCountMatch) result.meta.egoCount = egoCountMatch[1];

    const egoRPMMatch = text.match(/<constant[^>]*name="egoRPM"[^>]*>([\d.]+)/);
    if (egoRPMMatch) result.meta.egoRPM = egoRPMMatch[1];

    const egoDelayMatch = text.match(/<constant[^>]*name="ego_startdelay"[^>]*>([\d.]+)/);
    if (egoDelayMatch) result.meta.egoStartDelay = egoDelayMatch[1] + 's';

    const fcEgoDelayMatch = text.match(/<constant[^>]*name="fc_ego_delay"[^>]*>([\d.]+)/);
    if (fcEgoDelayMatch) result.meta.fcEgoDelay = fcEgoDelayMatch[1] + 's';

    // ===== INJECTOR DEAD TIME (MULTI-FIRMWARE) =====
    // Three completely different architectures:
    //   MS2/Extra 3.4.x: scalar injOpen (ms) + battFac (ms/V).
    //   MS3 1.5.x (Format 0566.xx): 18-point voltage curve as scalars injOpen1..injOpen18
    //                               plus injOpena/injOpenb extension points. Units = ms.
    //   MS3 1.6.x (Format 0601.xx): 6×6 voltage×pressure table inj_deadtime_table1
    //                               with paired inj_deadtime_volts1 breakpoints. Units = μs.
    // Branch on signature so we don't false-parse one format expecting another.
    const sigMatch = text.match(/signature="([^"]+)"/);
    const sig = sigMatch ? sigMatch[1] : '';
    result.meta.signature = sig;
    const isMS2Extra = /MS2Extra/i.test(sig);
    const isMS3_15 = /MS3 Format 0566/.test(sig);
    const isMS3_16 = /MS3 Format 0601/.test(sig);

    if (isMS2Extra) {
        result.meta.injArch = 'MS2/Extra scalar';
        const injOpenMatch = text.match(/<constant[^>]*name="injOpen"[^>]*>([\d.]+)/);
        if (injOpenMatch) result.meta.injOpen = parseFloat(injOpenMatch[1]);
        const battFacMatch = text.match(/<constant[^>]*name="battFac"[^>]*>([\d.]+)/);
        if (battFacMatch) result.meta.battFac = parseFloat(battFacMatch[1]);
    } else if (isMS3_15) {
        result.meta.injArch = 'MS3 1.5.x curve (18-point)';
        // Indices 1..18 plus a, b. Some indices may be absent (e.g., 9,10) — that's
        // fine, we collect whatever exists in declaration order.
        const curve = [];
        for (let i = 1; i <= 18; i++) {
            const m = text.match(new RegExp(`<constant[^>]*name="injOpen${i}"[^>]*>([\\d.\\-]+)`));
            if (m) curve.push({ idx: i, v: parseFloat(m[1]) });
        }
        const aM = text.match(/<constant[^>]*name="injOpena"[^>]*>([\d.\-]+)/);
        if (aM) curve.push({ idx: 'a', v: parseFloat(aM[1]) });
        const bM = text.match(/<constant[^>]*name="injOpenb"[^>]*>([\d.\-]+)/);
        if (bM) curve.push({ idx: 'b', v: parseFloat(bM[1]) });
        if (curve.length) result.meta.injCurve = curve;  // values in ms
    } else if (isMS3_16) {
        result.meta.injArch = 'MS3 1.6.x voltage×pressure table';
        // inj_deadtime_table1 is rows=6 cols=6 = 6 pressure × 6 voltage = 36 values
        // First row (lowest pressure) is the most representative for typical fuel rail
        const tableRegex = /<constant[^>]*name="inj_deadtime_table1"[^>]*rows="(\d+)"[^>]*>([\s\S]*?)<\/constant>/;
        const tableMatch = text.match(tableRegex);
        const voltsMatch = text.match(/<constant[^>]*name="inj_deadtime_volts1"[^>]*>([\s\S]*?)<\/constant>/);
        const pressMatch = text.match(/<constant[^>]*name="inj_deadtime_pressure1"[^>]*>([\s\S]*?)<\/constant>/);
        if (tableMatch && voltsMatch) {
            const allValsUs = tableMatch[2].trim().split(/\s+/).map(parseFloat).filter(v => !isNaN(v));
            const volts = voltsMatch[1].trim().split(/\s+/).map(parseFloat).filter(v => !isNaN(v));
            const press = pressMatch ? pressMatch[1].trim().split(/\s+/).map(parseFloat).filter(v => !isNaN(v)) : [];
            const nVolts = volts.length;
            // First row = lowest pressure curve. Convert μs → ms for consistency with MS2/MS3 1.5.
            const firstPressureRow = allValsUs.slice(0, nVolts).map(us => us / 1000);
            result.meta.injCurveVolts = volts;
            result.meta.injCurve = firstPressureRow.map((v, i) => ({ idx: volts[i], v: v }));
            if (press.length) result.meta.injPressureRef = press[0];  // psi or kPa, displayed as-is
        }
    } else {
        // Unknown firmware — try scalar fallback so we at least show something
        result.meta.injArch = 'Unknown (' + sig + ') — trying scalar fallback';
        const injOpenMatch = text.match(/<constant[^>]*name="injOpen"[^>]*>([\d.]+)/);
        if (injOpenMatch) result.meta.injOpen = parseFloat(injOpenMatch[1]);
        const battFacMatch = text.match(/<constant[^>]*name="battFac"[^>]*>([\d.]+)/);
        if (battFacMatch) result.meta.battFac = parseFloat(battFacMatch[1]);
    }
    // ===== END INJECTOR DEAD TIME =====

    const reqFuelMatch = text.match(/<constant[^>]*name="reqFuel"[^>]*>([\d.]+)/);
    if (reqFuelMatch) result.meta.reqFuel = reqFuelMatch[1] + 'ms';

    const dividerMatch = text.match(/<constant[^>]*name="divider"[^>]*>([\d.]+)/);
    if (dividerMatch) result.meta.divider = dividerMatch[1];

    const alternateMatch = text.match(/<constant[^>]*name="alternate"[^>]*>"([^"]+)"/);
    if (alternateMatch) result.meta.alternate = alternateMatch[1];

    const nInjMatch = text.match(/<constant[^>]*name="nInjectors"[^>]*>"(\d+)"/);
    if (nInjMatch) result.meta.nInjectors = nInjMatch[1];

    const injSizeMatch = text.match(/<constant[^>]*name="staged_pri_size"[^>]*>([\d.]+)/);
    if (injSizeMatch && parseFloat(injSizeMatch[1]) > 0) result.meta.injSize = injSizeMatch[1] + 'cc';

    // DFCO settings
    const fcRPMMatch = text.match(/<constant[^>]*name="fc_rpm"[^>]*>([\d.]+)/);
    if (fcRPMMatch) result.meta.fcRPM = fcRPMMatch[1];

    const fcDelayMatch = text.match(/<constant[^>]*name="fc_delay"[^>]*>([\d.]+)/);
    if (fcDelayMatch) result.meta.fcDelay = fcDelayMatch[1] + 's';

    const fcKpaMatch = text.match(/<constant[^>]*name="fc_kpa"[^>]*>([\d.]+)/);
    if (fcKpaMatch) result.meta.fcKpa = fcKpaMatch[1] + ' kPa';

    const fcTPSMatch = text.match(/<constant[^>]*name="fc_tps"[^>]*>([\d.]+)/);
    if (fcTPSMatch) result.meta.fcTPS = fcTPSMatch[1] + '%';

    // AFR tables
    for (let t = 1; t <= 2; t++) {
        const afrName = `afrTable${t}`;
        const afrRegex = new RegExp(`<constant[^>]*name="${afrName}"[^>]*rows="(\\d+)"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const afrMatch2 = text.match(afrRegex);
        if (afrMatch2) {
            const rows = parseInt(afrMatch2[1]);
            const values = afrMatch2[2].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
            const cols = values.length / rows;
            const table = [];
            for (let r = 0; r < rows; r++) {
                table.push(values.slice(r * cols, (r + 1) * cols));
            }
            result.tables[afrName] = { data: table, rows, cols };
        }
    }

    // WUE curve
    const tempTableMatch = text.match(/<constant[^>]*name="tempTable"[^>]*>([\s\S]*?)<\/constant>/);
    if (tempTableMatch) {
        result.meta.wueTempBins = tempTableMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
    }
    const wueBinsMatch = text.match(/<constant[^>]*name="wueBins"[^>]*>([\s\S]*?)<\/constant>/);
    if (wueBinsMatch) {
        result.meta.wueBins = wueBinsMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
    }

    // ASE
    const aseMatch = text.match(/<constant[^>]*name="asePctTable"[^>]*>([\s\S]*?)<\/constant>/);
    if (aseMatch) {
        result.meta.aseBins = aseMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
    }

    // AE settings
    const taeTimeMatch = text.match(/<constant[^>]*name="taeTime"[^>]*>([\d.]+)/);
    if (taeTimeMatch) result.meta.taeTime = taeTimeMatch[1] + 's';

    const taeColdAMatch = text.match(/<constant[^>]*name="taeColdA"[^>]*>([\d.]+)/);
    if (taeColdAMatch) result.meta.taeColdA = taeColdAMatch[1] + 'ms';

    const taeColdMMatch = text.match(/<constant[^>]*name="taeColdM"[^>]*>([\d.]+)/);
    if (taeColdMMatch) result.meta.taeColdM = taeColdMMatch[1] + '%';

    const tpsThreshMatch = text.match(/<constant[^>]*name="tpsThresh"[^>]*>([\d.]+)/);
    if (tpsThreshMatch) result.meta.tpsThresh = tpsThreshMatch[1] + ' %/s';

    const mapThreshMatch = text.match(/<constant[^>]*name="mapThresh"[^>]*>([\d.]+)/);
    if (mapThreshMatch) result.meta.mapThresh = mapThreshMatch[1] + ' kPa/s';

    const aeLorpmMatch = text.match(/<constant[^>]*name="ae_lorpm"[^>]*>([\d.]+)/);
    if (aeLorpmMatch) result.meta.aeLorpm = aeLorpmMatch[1];

    const aeHirpmMatch = text.match(/<constant[^>]*name="ae_hirpm"[^>]*>([\d.]+)/);
    if (aeHirpmMatch) result.meta.aeHirpm = aeHirpmMatch[1];

    const tdePctMatch = text.match(/<constant[^>]*name="tdePct"[^>]*>([\d.]+)/);
    if (tdePctMatch) result.meta.tdePct = tdePctMatch[1] + '%';

    const taeBinsMatch = text.match(/<constant[^>]*name="taeBins"[^>]*>([\s\S]*?)<\/constant>/);
    if (taeBinsMatch) {
        result.meta.taeBins = taeBinsMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
    }

    const taeRatesMatch = text.match(/<constant[^>]*name="taeRates"[^>]*>([\s\S]*?)<\/constant>/);
    if (taeRatesMatch) {
        result.meta.taeRates = taeRatesMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
    }

    const eaeLagSrcMatch = text.match(/<constant[^>]*name="EAElagsource"[^>]*>"([^"]+)"/);
    if (eaeLagSrcMatch) result.meta.eaeLagSource = eaeLagSrcMatch[1];

    const eaeLagThreshMatch = text.match(/<constant[^>]*name="EAElagthresh"[^>]*>([\d.]+)/);
    if (eaeLagThreshMatch) result.meta.eaeLagThresh = eaeLagThreshMatch[1];

    const eaeLagRPMMatch = text.match(/<constant[^>]*name="EAElagRPMmax"[^>]*>([\d.]+)/);
    if (eaeLagRPMMatch) result.meta.eaeLagRPMmax = eaeLagRPMMatch[1];

    // Rev limiter
    const revLimMatch = text.match(/<constant[^>]*name="RevLimNormal2"[^>]*>([\d.]+)/);
    if (revLimMatch) result.meta.revLimit = revLimMatch[1] + ' RPM';

    const revLimHystMatch = text.match(/<constant[^>]*name="RevLimNormal2_hyst"[^>]*>([\d.]+)/);
    if (revLimHystMatch) result.meta.revLimHyst = revLimHystMatch[1] + ' RPM';

    const revLimRetMatch = text.match(/<constant[^>]*name="RevLimOption_retard"[^>]*>"([^"]+)"/);
    if (revLimRetMatch) result.meta.revLimRetard = revLimRetMatch[1];

    const revLimFCMatch = text.match(/<constant[^>]*name="RevLimOption_fuelcut"[^>]*>"([^"]+)"/);
    if (revLimFCMatch) result.meta.revLimFuelCut = revLimFCMatch[1];

    const revLimMaxRtdMatch = text.match(/<constant[^>]*name="RevLimMaxRtd"[^>]*>([\d.]+)/);
    if (revLimMaxRtdMatch) result.meta.revLimMaxRetard = revLimMaxRtdMatch[1] + ' deg';

    // Cranking RPM
    const crankRPMMatch = text.match(/<constant[^>]*name="crankingRPM"[^>]*>([\d.]+)/);
    if (crankRPMMatch) result.meta.crankingRPM = crankRPMMatch[1] + ' RPM';

    // CLT sensor type
    const cltExpMatch = text.match(/name="clt_exp"[^>]*>"([^"]+)"/);
    if (cltExpMatch) result.meta.cltSensor = cltExpMatch[1];

    // ===== MAT CORRECTION TABLES (NEW) =====
    // MS2/Extra exposes two fuel-correction MAT tables:
    //   matCorrTemps / matCorrDelta (6-row legacy, often disabled/zeroed)
    //   matCorrTemps2 / matCorrDelta2 (9-row active table, MS2/Extra 3.4.x default)
    // Plus a SPARK retard MAT table (matTemps / matRetard) for knock protection.
    // Pair each Temp array with its Delta array. parseMatPair returns null if either
    // is missing so the display code can skip cleanly without TypeErrors.
    function parseMatPair(tempName, deltaName) {
        const tempRegex = new RegExp(`<constant[^>]*name="${tempName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const tempMatch = text.match(tempRegex);
        const deltaRegex = new RegExp(`<constant[^>]*name="${deltaName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const deltaMatch = text.match(deltaRegex);
        if (!tempMatch || !deltaMatch) return null;
        const temps = tempMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        const deltas = deltaMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        if (temps.length === 0 || deltas.length === 0 || temps.length !== deltas.length) return null;
        return { temps, deltas };
    }

    const matCorrV1 = parseMatPair('matCorrTemps', 'matCorrDelta');
    if (matCorrV1) result.meta.matCorrV1 = matCorrV1;

    const matCorrV2 = parseMatPair('matCorrTemps2', 'matCorrDelta2');
    if (matCorrV2) result.meta.matCorrV2 = matCorrV2;

    const matSparkRetard = parseMatPair('matTemps', 'matRetard');
    if (matSparkRetard) result.meta.matSparkRetard = matSparkRetard;

    // MAT sensor calibration scalars
    const mat0Match = text.match(/<constant[^>]*name="mat0"[^>]*>([\d.\-]+)/);
    if (mat0Match) result.meta.matBias = parseFloat(mat0Match[1]);

    const matMultMatch = text.match(/<constant[^>]*name="matmult"[^>]*>([\d.]+)/);
    if (matMultMatch) result.meta.matMult = parseFloat(matMultMatch[1]);

    // ===== END MAT CORRECTION =====

    // Spark advance tables (12x12)
    for (let t = 1; t <= 2; t++) {
        const spkName = `advanceTable${t}`;
        const spkRpmName = `srpm_table${t}`;
        const spkMapName = `smap_table${t}`;

        const spkRegex = new RegExp(`<constant[^>]*name="${spkName}"[^>]*rows="(\\d+)"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const spkMatch = text.match(spkRegex);
        if (spkMatch) {
            const rows = parseInt(spkMatch[1]);
            const values = spkMatch[2].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
            const cols = values.length / rows;
            const table = [];
            for (let r = 0; r < rows; r++) {
                table.push(values.slice(r * cols, (r + 1) * cols));
            }
            result.tables[spkName] = { data: table, rows, cols, type: 'spark' };
        }

        const spkRpmRegex = new RegExp(`<constant[^>]*name="${spkRpmName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const spkRpmMatch = text.match(spkRpmRegex);
        if (spkRpmMatch) {
            result.breakpoints[spkRpmName] = spkRpmMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        }

        const spkMapRegex = new RegExp(`<constant[^>]*name="${spkMapName}"[^>]*>([\\s\\S]*?)<\\/constant>`);
        const spkMapMatch = text.match(spkMapRegex);
        if (spkMapMatch) {
            result.breakpoints[spkMapName] = spkMapMatch[1].trim().split(/\s+/).map(v => parseFloat(v)).filter(v => !isNaN(v));
        }
    }

    return result;
}

// ===== MAT CORRECTION ANALYSIS (NEW) =====
// Given a (temps[], deltas[]) pair, evaluate it against ideal-gas-law expected
// fuel correction. The ratio of densities at two MAT values is T1/T2 (in Kelvin
// at constant manifold pressure), so perfect MAT correction should produce
// Air_cor(T2) = Air_cor(T1) * (T1_K / T2_K).
//
// Real engines never hit 100% because density isn't the only thing that changes
// with MAT (charge cooling effectiveness, fuel atomization, residual gas mass,
// knock margin all shift). Most tuners consider 85-95% well-tuned, 95%+
// excellent. Returns null when the table is all zeros (disabled) or has fewer
// than 2 distinct non-zero values to fit a slope.
function analyzeMatCorr(pair) {
    if (!pair) return null;
    const { temps, deltas } = pair;
    if (temps.length < 2) return null;

    // Check if disabled (all deltas zero or all identical)
    const minD = Math.min(...deltas);
    const maxD = Math.max(...deltas);
    const range = maxD - minD;
    if (range < 0.1) {
        return { disabled: true, reason: 'all values within 0.1% — table not in use' };
    }

    // Active range: trim leading/trailing bins where consecutive values are
    // identical (these are usually unused extrapolation rows past sensor range).
    // Keep first/last differing bins for slope computation.
    let lo = 0, hi = deltas.length - 1;
    while (lo < hi && Math.abs(deltas[lo+1] - deltas[lo]) < 0.05) lo++;
    while (hi > lo && Math.abs(deltas[hi] - deltas[hi-1]) < 0.05) hi--;

    const tempLo = temps[lo], tempHi = temps[hi];
    const deltaLo = deltas[lo], deltaHi = deltas[hi];
    const tempRange = tempHi - tempLo;
    const deltaRange = deltaHi - deltaLo;
    const slope = tempRange > 0 ? deltaRange / tempRange : 0;

    // Ideal-gas expectation across the active range:
    // density_hi / density_lo = T_lo / T_hi (Kelvin at constant pressure)
    const t1K = (tempLo - 32) * 5/9 + 273.15;
    const t2K = (tempHi - 32) * 5/9 + 273.15;
    const idealRatio = t1K / t2K;
    // If reference Air cor at tempLo is deltaLo, perfect compensation at tempHi
    // would deliver deltaLo * idealRatio. Express ideal change relative to deltaLo:
    const idealDeltaRange = deltaLo * (idealRatio - 1);

    let compensationPct = null;
    if (Math.abs(idealDeltaRange) > 0.1) {
        compensationPct = (deltaRange / idealDeltaRange) * 100;
    }

    // Direction sanity
    const slopeIsNegative = slope < 0;
    let direction = 'unknown';
    if (slopeIsNegative) direction = 'correct (pulls fuel as MAT rises)';
    else if (slope > 0) direction = 'BACKWARDS (adds fuel as MAT rises — broken)';

    return {
        disabled: false,
        activeFrom: tempLo,
        activeTo: tempHi,
        deltaAt: { lo: deltaLo, hi: deltaHi },
        slope: slope,
        slopeUnit: '%/°F',
        idealSlope: tempRange > 0 ? idealDeltaRange / tempRange : 0,
        compensationPct: compensationPct,
        direction: direction
    };
}

function formatMatCorrSection(label, pair, includeAnalysis) {
    if (!pair) return '';
    const padNum = v => {
        const sign = v >= 0 ? '+' : '';
        return (sign + v.toFixed(1)).padStart(8);
    };
    const padTemp = v => String(Math.round(v)).padStart(8);
    let txt = `\n--- ${label} ---\n`;
    txt += `Temp (°F):  ${pair.temps.map(padTemp).join('')}\n`;
    txt += `Correction: ${pair.deltas.map(padNum).join('')}\n`;

    if (!includeAnalysis) return txt;

    const a = analyzeMatCorr(pair);
    if (!a) return txt;
    if (a.disabled) {
        txt += `Status: DISABLED (${a.reason})\n`;
        return txt;
    }

    txt += `\nActive range: ${a.activeFrom}°F → ${a.activeTo}°F  (${a.activeTo - a.activeFrom}°F span)\n`;
    txt += `Correction:   ${a.deltaAt.lo.toFixed(1)}% → ${a.deltaAt.hi.toFixed(1)}%  (${(a.deltaAt.hi - a.deltaAt.lo).toFixed(1)}% change)\n`;
    txt += `Slope:        ${a.slope.toFixed(3)}${a.slopeUnit}\n`;
    txt += `Direction:    ${a.direction}\n`;
    txt += `Ideal-gas slope at this MAT range: ${a.idealSlope.toFixed(3)}${a.slopeUnit}\n`;
    if (a.compensationPct !== null) {
        const pct = a.compensationPct;
        let verdict;
        if (a.slope > 0) {
            verdict = '⚠️ TABLE IS BACKWARDS — fuel is added as MAT rises. Check the table sign.';
        } else if (pct < 50) {
            verdict = `⚠️ UNDER-COMPENSATING — table delivers only ${pct.toFixed(0)}% of theoretical density correction. Engine will go lean at hot MAT.`;
        } else if (pct < 80) {
            verdict = `⚠ Modestly under-compensated (${pct.toFixed(0)}% of theoretical). Workable but VE corrections from logs will absorb some MAT error.`;
        } else if (pct <= 110) {
            verdict = `✓ WELL-TUNED — ${pct.toFixed(0)}% of theoretical ideal-gas compensation. Tool VE corrections trustworthy on MAT axis.`;
        } else if (pct <= 130) {
            verdict = `⚠ Slightly OVER-compensating (${pct.toFixed(0)}% of theoretical). Engine may go rich at hot MAT.`;
        } else {
            verdict = `⚠️ OVER-COMPENSATING (${pct.toFixed(0)}% of theoretical). Re-check table — typical good range is 85-110%.`;
        }
        txt += `Compensation: ${pct.toFixed(0)}% of theoretical\n`;
        txt += `Verdict:      ${verdict}\n`;
    }
    return txt;
}

function formatMatSparkRetardSection(pair) {
    if (!pair) return '';
    const padTemp = v => String(Math.round(v)).padStart(8);
    const padNum = v => v.toFixed(1).padStart(8);
    let txt = `\n--- MAT SPARK RETARD (knock protection) ---\n`;
    txt += `Temp (°F):  ${pair.temps.map(padTemp).join('')}\n`;
    txt += `Retard (°): ${pair.deltas.map(padNum).join('')}\n`;
    const maxRet = Math.max(...pair.deltas);
    if (maxRet < 0.1) {
        txt += `Status: DISABLED (no retard programmed)\n`;
    } else {
        const firstActiveIdx = pair.deltas.findIndex(v => v > 0.1);
        const firstActiveTemp = firstActiveIdx >= 0 ? pair.temps[firstActiveIdx] : null;
        txt += `Active from ${firstActiveTemp}°F, max retard ${maxRet.toFixed(1)}° at ${pair.temps[pair.deltas.indexOf(maxRet)]}°F\n`;
    }
    return txt;
}
// ===== END MAT CORRECTION ANALYSIS =====

function getFlippedTable(tableName) {
    const t = parsedData.tables[tableName];
    if (!t) return null;
    return {
        data: [...t.data].reverse(),
        rows: t.rows,
        cols: t.cols
    };
}

function getFlippedMapBreaks(tableName) {
    let mapKey;
    if (tableName.includes('dozen')) {
        mapKey = 'fmap_table' + tableName.match(/\d/)[0] + 'doz';
    } else if (tableName.startsWith('advance')) {
        mapKey = 'smap_table' + tableName.match(/\d/)[0];
    } else if (tableName.startsWith('afr')) {
        mapKey = 'fmap_table' + tableName.match(/\d/)[0] + 'doz';
    } else {
        mapKey = 'fmap_table' + tableName.match(/\d/)[0];
    }
    const breaks = parsedData.breakpoints[mapKey];
    if (!breaks) return null;
    return [...breaks].reverse();
}

function getRpmBreaks(tableName) {
    let rpmKey;
    if (tableName.includes('dozen')) {
        rpmKey = 'frpm_table' + tableName.match(/\d/)[0] + 'doz';
    } else if (tableName.startsWith('advance')) {
        rpmKey = 'srpm_table' + tableName.match(/\d/)[0];
    } else if (tableName.startsWith('afr')) {
        rpmKey = 'frpm_table' + tableName.match(/\d/)[0] + 'doz';
    } else {
        rpmKey = 'frpm_table' + tableName.match(/\d/)[0];
    }
    return parsedData.breakpoints[rpmKey] || null;
}

function displayResults() {
    const meta = parsedData.meta;
    let info = '';

    if (meta.firmware) info += `Firmware: ${meta.firmware}\n`;
    if (meta.date) info += `Saved: ${meta.date}\n`;
    if (meta.algorithm) info += `Algorithm: ${meta.algorithm}\n`;
    if (meta.cylinders) info += `Cylinders: ${meta.cylinders}\n`;

    info += `\n--- Injector Configuration ---\n`;
    if (meta.injArch) info += `Architecture: ${meta.injArch}\n`;

    // Linear interpolation helper for the curve display.
    // For MS2/Extra (scalar) we have injOpen + battFac and a known linear model.
    // For MS3 we have a sampled curve and need to interpolate between samples.
    function injAt(volts) {
        if (meta.injOpen !== undefined && meta.battFac !== undefined) {
            // MS2/Extra linear model: dead time at 14V is the reference (injOpen),
            // each V below 14 adds battFac ms, each V above subtracts.
            return meta.injOpen + meta.battFac * (14 - volts);
        }
        if (meta.injCurve && meta.injCurve.length >= 2) {
            // For MS3 1.6.x we have explicit voltage breakpoints in injCurveVolts.
            // For MS3 1.5.x voltage points are firmware-defined (typically 6V→14V
            // at 1V steps for indices 1..9, then 14.5..21V for 10..18); since we
            // can't be certain of the exact spacing without firmware docs, we use
            // a heuristic: if injCurveVolts is present use it, otherwise assume
            // index 9 (or last value before 18) ≈ 14V reference and interpolate
            // linearly across the central portion of the curve.
            const curve = meta.injCurve;
            if (meta.injCurveVolts) {
                // MS3 1.6.x — true voltage breakpoints available
                const vs = meta.injCurveVolts;
                const ds = curve.map(c => c.v);
                if (volts <= vs[0]) return ds[0];
                if (volts >= vs[vs.length - 1]) return ds[vs.length - 1];
                for (let i = 0; i < vs.length - 1; i++) {
                    if (volts >= vs[i] && volts <= vs[i+1]) {
                        const frac = (volts - vs[i]) / (vs[i+1] - vs[i]);
                        return ds[i] + frac * (ds[i+1] - ds[i]);
                    }
                }
            }
            // MS3 1.5.x fallback: assume 1V spacing centered on injOpen9 ≈ 14V.
            // This may be off by a fraction of a volt depending on firmware
            // convention but gives a reasonable representative reading.
            const center14Idx = Math.min(8, curve.length - 1);
            const offsetFrom14 = volts - 14;
            const targetIdx = Math.max(0, Math.min(curve.length - 1, center14Idx + Math.round(offsetFrom14)));
            return curve[targetIdx].v;
        }
        return null;
    }

    if (meta.injCurve || (meta.injOpen !== undefined && meta.battFac !== undefined)) {
        info += `Dead Time:\n`;
        const refs = [12.0, 13.5, 14.0, 14.5];
        for (const v of refs) {
            const dt = injAt(v);
            if (dt !== null) info += `  @ ${v.toFixed(1)}V: ${dt.toFixed(3)}ms\n`;
        }
        if (meta.injOpen !== undefined) info += `  (Base injOpen ${meta.injOpen}ms, battFac ${meta.battFac} ms/V)\n`;
        if (meta.injCurve && meta.injCurveVolts) {
            info += `  Voltage breakpoints (V): ${meta.injCurveVolts.map(v => v.toFixed(1)).join(', ')}\n`;
            info += `  Dead time curve (ms):    ${meta.injCurve.map(c => c.v.toFixed(3)).join(', ')}\n`;
            if (meta.injPressureRef) info += `  At lowest pressure setting: ${meta.injPressureRef.toFixed(1)} (firmware-defined units)\n`;
        } else if (meta.injCurve) {
            info += `  18-point voltage curve (ms): ${meta.injCurve.map(c => c.v.toFixed(3)).join(', ')}\n`;
            info += `  (MS3 1.5.x firmware-defined voltage breakpoints — reference values shown above are interpolated)\n`;
        }
        // Sanity warning if all values are placeholder-equal
        if (meta.injCurve) {
            const vals = meta.injCurve.map(c => c.v);
            const allSame = vals.every(v => Math.abs(v - vals[0]) < 0.05);
            if (allSame) info += `  ⚠️ All curve values within 0.05ms — likely placeholder/uninitialized dead time. Customer should populate proper injector data.\n`;
        }
    }
    if (meta.reqFuel) info += `Req Fuel: ${meta.reqFuel}\n`;
    if (meta.divider) info += `Divider: ${meta.divider}\n`;
    if (meta.nInjectors) info += `Injectors: ${meta.nInjectors}\n`;
    if (meta.injSize) info += `Injector Size: ${meta.injSize}\n`;
    if (meta.alternate) info += `Firing: ${meta.alternate}\n`;

    info += `\n--- EGO / Closed Loop ---\n`;
    if (meta.egoOption) info += `EGO Mode: ${meta.egoOption}\n`;
    if (meta.egoAuthority) info += `EGO Authority: ±${meta.egoAuthority}\n`;
    if (meta.egoCount) info += `EGO Steps/Cycle: ${meta.egoCount}\n`;
    if (meta.egoRPM) info += `EGO Min RPM: ${meta.egoRPM}\n`;
    if (meta.egoStartDelay) info += `EGO Start Delay: ${meta.egoStartDelay}\n`;
    if (meta.fcEgoDelay) info += `EGO Delay After FC: ${meta.fcEgoDelay}\n`;

    info += `\n--- DFCO (Overrun Fuel Cut) ---\n`;
    if (meta.fcRPM) info += `FC RPM: ${meta.fcRPM}\n`;
    if (meta.fcKpa) info += `FC MAP: ${meta.fcKpa}\n`;
    if (meta.fcTPS) info += `FC TPS: ${meta.fcTPS}\n`;
    if (meta.fcDelay) info += `FC Delay: ${meta.fcDelay}\n`;

    info += `\n--- Warmup Enrichment (WUE) ---\n`;
    if (meta.wueTempBins && meta.wueBins) {
        info += `Temp (°F): ${meta.wueTempBins.map(v => String(v).padStart(6)).join('')}\n`;
        info += `WUE (%):   ${meta.wueBins.map(v => String(Math.round(v)).padStart(6)).join('')}\n`;
        const wue160 = meta.wueTempBins.findIndex(t => t >= 160);
        if (wue160 >= 0) {
            info += `  → WUE at ${meta.wueTempBins[wue160]}°F: ${meta.wueBins[wue160]}%`;
            if (meta.wueBins[wue160] > 105) info += `  ⚠️ Above 105% — tool should filter`;
            else info += `  ✓ At 100% — no filtering needed`;
            info += '\n';
        }
    }

    if (meta.aseBins && meta.wueTempBins) {
        info += `\n--- After Start Enrichment (ASE) ---\n`;
        info += `ASE (%): ${meta.aseBins.map(v => String(Math.round(v)).padStart(6)).join('')}\n`;
    }

    info += `\n--- Accel Enrichment (AE) ---\n`;
    if (meta.taeTime) info += `AE Duration: ${meta.taeTime}\n`;
    if (meta.taeColdA) info += `AE Cold Adder: ${meta.taeColdA}\n`;
    if (meta.taeColdM) info += `AE Cold Multiplier: ${meta.taeColdM}\n`;
    if (meta.tpsThresh) info += `TPS Threshold: ${meta.tpsThresh}\n`;
    if (meta.mapThresh) info += `MAP Threshold: ${meta.mapThresh}\n`;
    if (meta.aeLorpm && meta.aeHirpm) info += `AE RPM Range: ${meta.aeLorpm} - ${meta.aeHirpm}\n`;
    if (meta.tdePct) info += `Decel Enleanment: ${meta.tdePct}\n`;
    if (meta.taeBins && meta.taeRates) {
        info += `TPS AE Curve: ${meta.taeRates.map(v => v + '%/s').join(', ')} → ${meta.taeBins.map(v => v + 'ms').join(', ')}\n`;
    }
    if (meta.eaeLagSource) {
        info += `EAE Lag: ${meta.eaeLagSource} > ${meta.eaeLagThresh} (RPM < ${meta.eaeLagRPMmax})\n`;
    }

    // ===== MAT CORRECTION DISPLAY (NEW) =====
    // Always show this section if any MAT-related data exists so the customer
    // can see what their tune has — including disabled tables (which is also
    // useful info — confirms a legacy table is correctly off).
    if (meta.matCorrV1 || meta.matCorrV2 || meta.matSparkRetard) {
        info += `\n========== MAT CORRECTION (FUEL) ==========\n`;
        if (meta.matBias !== undefined || meta.matMult !== undefined) {
            info += `Sensor calibration: bias ${meta.matBias ?? '?'}°F`;
            if (meta.matMult !== undefined) info += `, multiplier ${meta.matMult}%`;
            info += `\n`;
        }

        // Legacy 6-row table v1. UNIT SEMANTICS VARY BY FIRMWARE:
        //   MS2/Extra 3.4.x: typically disabled (all zeros). Absolute % when used.
        //   MS3 1.5.x: ACTIVE — values are delta-from-100 (e.g., -4 to +8 means
        //              96% to 108%). Sign convention also varies.
        //   MS3 1.6.x: typically disabled (all zeros).
        // Because we can't reliably tell delta-style from absolute-style without
        // firmware version checks, show v1 as raw values only — no comp% verdict.
        if (meta.matCorrV1) {
            info += formatMatCorrSection('MAT Corr v1 (legacy 6-row)', meta.matCorrV1, false);
            // Disabled detection: still useful to call out
            const range1 = Math.max(...meta.matCorrV1.deltas) - Math.min(...meta.matCorrV1.deltas);
            if (range1 < 0.1) {
                info += `Status: DISABLED\n`;
            } else {
                info += `Status: ACTIVE — legacy table units vary by firmware version; no automated verdict.\n`;
                info += `        Consult MS2/MS3 manual for your firmware to interpret.\n`;
            }
        }

        // The active 9-row v2 table has CONSISTENT absolute-% semantics across
        // MS2/Extra 3.4.x, MS3 1.5.x, and MS3 1.6.x — safe to run physics verdict.
        if (meta.matCorrV2) {
            info += formatMatCorrSection('MAT Corr v2 (active 9-row)', meta.matCorrV2, true);
            // Non-monotonic shape detection — physics-correct MAT correction
            // should monotonically decrease as MAT rises. An inflection point
            // (correction going DOWN then back UP) is usually a tune error or
            // intentional hot-MAT enrichment for knock protection. Flag it.
            const d = meta.matCorrV2.deltas;
            let signChanges = 0;
            let prevDir = 0;
            for (let i = 1; i < d.length; i++) {
                const delta = d[i] - d[i-1];
                const dir = delta > 0.05 ? 1 : (delta < -0.05 ? -1 : 0);
                if (dir !== 0 && prevDir !== 0 && dir !== prevDir) signChanges++;
                if (dir !== 0) prevDir = dir;
            }
            if (signChanges >= 1) {
                info += `⚠️ NON-MONOTONIC SHAPE — correction direction reverses ${signChanges} time(s) across the table.\n`;
                info += `   May be intentional (hot-MAT knock enrichment) or a tune error. Verify against MS2/MS3 manual.\n`;
            }
        }

        // Spark retard for hot MAT (knock protection — not fuel)
        if (meta.matSparkRetard) {
            info += formatMatSparkRetardSection(meta.matSparkRetard);
        }

        info += `\nMAT VERDICT GUIDE\n`;
        info += `  85-110% of theoretical = well-tuned\n`;
        info += `  50-85%  = under-compensated, VE corrections will absorb MAT error\n`;
        info += `  <50% or backwards = MAT correction needs work before VE tuning\n`;
        info += `  >130%   = over-compensated, fuel pulled too aggressively at hot MAT\n`;
    }
    // ===== END MAT CORRECTION DISPLAY =====

    info += `\n--- Rev Limiter ---\n`;
    if (meta.revLimit) info += `Rev Limit: ${meta.revLimit}\n`;
    if (meta.revLimHyst) info += `Hysteresis: ${meta.revLimHyst}\n`;
    if (meta.revLimRetard) info += `Retard Mode: ${meta.revLimRetard}\n`;
    if (meta.revLimFuelCut) info += `Fuel Cut: ${meta.revLimFuelCut}\n`;
    if (meta.revLimMaxRetard) info += `Max Retard: ${meta.revLimMaxRetard}\n`;

    info += `\n--- Sensors ---\n`;
    if (meta.cltSensor) info += `CLT Sensor: ${meta.cltSensor}\n`;
    if (meta.crankingRPM) info += `Cranking RPM: ${meta.crankingRPM}\n`;

    const tableNames = Object.keys(parsedData.tables);
    info += `\n--- Tables Found ---\n`;
    for (const name of tableNames) {
        const t = parsedData.tables[name];
        info += `  ${name}: ${t.rows}x${t.cols}\n`;
    }

    document.getElementById('info').textContent = info;
    document.getElementById('info').style.display = 'block';

    const select = document.getElementById('tableSelect');
    select.innerHTML = '';
    for (const name of tableNames) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = `${name} (${parsedData.tables[name].rows}x${parsedData.tables[name].cols})`;
        select.appendChild(opt);
    }
    selectedTable = tableNames[0];

    document.getElementById('buttons').style.display = 'block';
    displaySelected();
}

function fmtVE(v) {
    if (v % 1 === 0) return String(Math.round(v));
    return parseFloat(v.toFixed(1)).toString();
}

function displaySelected() {
    selectedTable = document.getElementById('tableSelect').value;
    const flipped = getFlippedTable(selectedTable);
    const mapBreaks = getFlippedMapBreaks(selectedTable);
    const rpmBreaks = getRpmBreaks(selectedTable);

    if (!flipped) {
        document.getElementById('tableDisplay').innerHTML = '<p style="color:red">Table not found</p>';
        return;
    }

    let html = `<p style="color:#999; font-size:12px; margin-bottom:8px;">
        Flipped for VE tool (Row 0 = highest MAP).
        RPM across top, MAP down side — matches TunerStudio layout.
    </p>`;
    html += '<table class="ve"><tr><th>kPa \\ RPM</th>';
    if (rpmBreaks) {
        for (const rpm of rpmBreaks) html += `<th>${Math.round(rpm)}</th>`;
    } else {
        for (let c = 0; c < flipped.cols; c++) html += `<th>Col ${c}</th>`;
    }
    html += '</tr>';

    for (let r = 0; r < flipped.rows; r++) {
        html += '<tr>';
        if (mapBreaks) {
            html += `<td class="header">${mapBreaks[r]}</td>`;
        } else {
            html += `<td class="header">Row ${r}</td>`;
        }
        for (let c = 0; c < flipped.cols; c++) {
            const v = flipped.data[r][c];
            const tableInfo = parsedData.tables[selectedTable];
            const isSpark = tableInfo && tableInfo.type === 'spark';
            const isAFR = selectedTable.startsWith('afr');
            let pct;
            if (isSpark) {
                pct = Math.min(1, Math.max(0, (v - 10) / 30));
            } else if (isAFR) {
                pct = Math.min(1, Math.max(0, (v - 11) / 4));
            } else {
                pct = Math.min(1, Math.max(0, (v - 40) / 120));
            }
            const r255 = Math.round(50 + pct * 150);
            const g255 = Math.round(80 + (1 - Math.abs(pct - 0.5) * 2) * 100);
            const b255 = Math.round(200 - pct * 150);
            html += `<td style="background:rgba(${r255},${g255},${b255},0.3)">${isAFR ? v.toFixed(1) : isSpark ? v.toFixed(1) : fmtVE(v)}</td>`;
        }
        html += '</tr>';
    }
    html += '</table>';

    document.getElementById('tableDisplay').innerHTML = html;
    document.getElementById('tableDisplay').style.display = 'block';

    buildTextOutput();
}

function buildTextOutput() {
    const flipped = getFlippedTable(selectedTable);
    const mapBreaks = getFlippedMapBreaks(selectedTable);
    const rpmBreaks = getRpmBreaks(selectedTable);
    if (!flipped) return;

    let txt = '';
    txt += `=== ${selectedTable} (flipped for VE tool) ===\n\n`;

    if (selectedTable.startsWith('veTable')) {
        const m = parsedData.meta;
        if (m.injOpen !== undefined || m.injCurve) {
            txt += `--- Injector Dead Time ---\n`;
            if (m.injArch) txt += `Architecture: ${m.injArch}\n`;
            // Inline injAt — uses the same logic as displayResults
            const injAtTxt = (volts) => {
                if (m.injOpen !== undefined && m.battFac !== undefined) {
                    return m.injOpen + m.battFac * (14 - volts);
                }
                if (m.injCurve && m.injCurve.length >= 2) {
                    if (m.injCurveVolts) {
                        const vs = m.injCurveVolts;
                        const ds = m.injCurve.map(c => c.v);
                        if (volts <= vs[0]) return ds[0];
                        if (volts >= vs[vs.length - 1]) return ds[vs.length - 1];
                        for (let i = 0; i < vs.length - 1; i++) {
                            if (volts >= vs[i] && volts <= vs[i+1]) {
                                const frac = (volts - vs[i]) / (vs[i+1] - vs[i]);
                                return ds[i] + frac * (ds[i+1] - ds[i]);
                            }
                        }
                    }
                    const c14 = Math.min(8, m.injCurve.length - 1);
                    const idx = Math.max(0, Math.min(m.injCurve.length - 1, c14 + Math.round(volts - 14)));
                    return m.injCurve[idx].v;
                }
                return null;
            };
            for (const v of [12.0, 13.5, 14.0, 14.5]) {
                const dt = injAtTxt(v);
                if (dt !== null) txt += `  @ ${v.toFixed(1)}V: ${dt.toFixed(3)}ms\n`;
            }
            if (m.injOpen !== undefined) txt += `Base (injOpen): ${m.injOpen}ms | battFac: ${m.battFac} ms/V\n`;
            txt += '\n';
        }
        if (m.egoAuthority) {
            txt += `--- EGO ---\n`;
            txt += `Authority: ±${m.egoAuthority}\n`;
            if (m.egoRPM) txt += `Min RPM: ${m.egoRPM}\n`;
            if (m.fcEgoDelay) txt += `Post-FC EGO Delay: ${m.fcEgoDelay}\n`;
            txt += '\n';
        }
        if (m.reqFuel) txt += `Req Fuel: ${m.reqFuel} | Divider: ${m.divider} | Firing: ${m.alternate}\n`;
        if (m.injSize) txt += `Injector Size: ${m.injSize} | Count: ${m.nInjectors}\n`;
        txt += '\n';
    }

    if (rpmBreaks) txt += `RPM Breakpoints: ${rpmBreaks.map(v => Math.round(v)).join(', ')}\n`;
    if (mapBreaks) txt += `MAP Breakpoints: ${mapBreaks.join(', ')}\n`;
    txt += '\n';

    txt += 'VE Table (paste into tool):\n';

    const isSparkTable = selectedTable.startsWith('advance');
    const isAFRTable = selectedTable.startsWith('afr');

    if (isSparkTable) {
        txt += 'SPARK ADVANCE TABLE (degrees):\n';
    } else if (isAFRTable) {
        txt += 'AFR TARGET TABLE:\n';
    }

    for (let r = 0; r < flipped.rows; r++) {
        if (isAFRTable) {
            txt += flipped.data[r].map(v => v.toFixed(1)).join('\t') + '\n';
        } else if (isSparkTable) {
            txt += flipped.data[r].map(v => v.toFixed(1)).join('\t') + '\n';
        } else {
            txt += flipped.data[r].map(v => fmtVE(v)).join('\t') + '\n';
        }
    }

    document.getElementById('output').textContent = txt;
    document.getElementById('output').style.display = 'block';
}

function copyVETable() {
    const flipped = getFlippedTable(selectedTable);
    if (!flipped) return;
    const isAFR = selectedTable.startsWith('afr');
    const isSpark = parsedData.tables[selectedTable] && parsedData.tables[selectedTable].type === 'spark';
    const txt = flipped.data.map(row => row.map(v => (isAFR || isSpark) ? v.toFixed(1) : fmtVE(v)).join('\t')).join('\n');
    navigator.clipboard.writeText(txt).then(() => {
        document.getElementById('status').textContent = '✓ Table copied (tab-delimited, ready to paste)';
        document.getElementById('status').style.color = '#4CAF50';
    });
}

function copyBreakpoints() {
    const mapBreaks = getFlippedMapBreaks(selectedTable);
    const rpmBreaks = getRpmBreaks(selectedTable);
    if (!mapBreaks || !rpmBreaks) return;
    const txt = `RPM: ${rpmBreaks.map(v => Math.round(v)).join(', ')}\nMAP: ${mapBreaks.join(', ')}`;
    navigator.clipboard.writeText(txt).then(() => {
        document.getElementById('status').textContent = '✓ Breakpoints copied';
        document.getElementById('status').style.color = '#4CAF50';
    });
}

function copyAll() {
    const flipped = getFlippedTable(selectedTable);
    const mapBreaks = getFlippedMapBreaks(selectedTable);
    const rpmBreaks = getRpmBreaks(selectedTable);
    if (!flipped) return;
    const isAFR = selectedTable.startsWith('afr');
    const isSpark = parsedData.tables[selectedTable] && parsedData.tables[selectedTable].type === 'spark';
    let txt = '';
    if (rpmBreaks) txt += `RPM: ${rpmBreaks.map(v => Math.round(v)).join(', ')}\n`;
    if (mapBreaks) txt += `MAP: ${mapBreaks.join(', ')}\n`;
    txt += '\n';
    txt += flipped.data.map(row => row.map(v => (isAFR || isSpark) ? v.toFixed(1) : fmtVE(v)).join('\t')).join('\n');
    navigator.clipboard.writeText(txt).then(() => {
        document.getElementById('status').textContent = '✓ All copied (breakpoints + table)';
        document.getElementById('status').style.color = '#4CAF50';
    });
}

function downloadMSQInfo() {
    // Download both the table block AND the full info panel (which now includes MAT analysis)
    const info = document.getElementById('info').textContent;
    const tableTxt = document.getElementById('output').textContent;
    const blob = new Blob([info + '\n\n' + tableTxt], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `MSQ_Extract_${selectedTable}_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
}
